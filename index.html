<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bilum Haus PNG</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Bilum Haus PNG</h1>
    <p>Handmade Bilums & Crafts from Papua New Guinea</p>
  </header>

  <section class="shop">
    <h2>Our Bilums</h2>
    <div class="product-grid">
      <div class="product">
        <img src="images/sepik bilum.jpg" alt="Sepik Traditional Bilum">
        <h3> Sepik Traditional Bilum</h3>
        <p class="price">K150</p>
        <button onclick="addToChart ('Sepik Traditional Bilum')">Add to Chart</button>
        <a href="https://wa.me/67573745735" class="btn">Order via WhatsApp</a>
      </div>
      <div class="product">
        <img src="images/morobe.jpg" alt="Morobe String Bilum">
        <h3>Morobe String Bilum</h3>
        <p class="price">K200</p>
        <button onclick="addToChart ('Morobe String Bilum')">Add to Chart</button>
        <a href="https://wa.me/67573745735" class="btn">Order via WhatsApp</a>
      </div>
      <div class="product">
        <img src="images/madang.jpg" alt="Madang Bilum">
        <h3>Mandang Bilum</h3>
        <p class="price">K100</p>
        <button onclick="addToChart ('Madang Bilum')">Add to Chart</button>
        <a href="https://wa.me/67573745735" class="btn">Order via WhatsApp</a>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2025 Bilum Haus PNG | Made in Papua New Guinea 🇵🇬</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
