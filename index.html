<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bilum Haus PNG</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Bilum Haus PNG</h1>
    <p>Handmade Bilums & Crafts from Papua New Guinea</p>
  </header>

  <section class="shop">
    <h2>Our Bilums</h2>
    <div class="product-grid">
      <div class="product">
        <img src="images/sepik bilum.jpg" alt="Traditional Bilum">
        <h3>Sepik Bilum Bilum</h3>
        <p class="price">K150</p>
        <button onclick="addToCart('Sepik Bilum', 150)">Add to Cart</button>
      </div>
      <div class="product">
        <img src="images/morobe.jpg" alt="Morobe Bilum">
        <h3>Morobe Bilum</h3>
        <p class="price">K200</p>
        <button onclick="addToCart('Morobe Bilum', 200)">Add to Cart</button>
      </div>
      <div class="product">
        <img src="images/madang.jpg" alt="Madang Bilum">
        <h3>Madang Bilum</h3>
        <p class="price">K100</p>
        <button onclick="addToCart('Madang Bilum', 100)">Add to Cart</button>
      </div>
    </div>
  </section>

  <section class="cart">
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <p id="total">Total: K0</p>
  </section>

  <section class="checkout">
    <h2>Checkout Form</h2>
    <form id="checkout-form" onsubmit="sendOrder(event)">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="text" id="address" placeholder="Delivery Address" required>
      <input type="text" id="phone" placeholder="Phone Number" required>
      <button type="submit">Place Order via WhatsApp</button>
    </form>
  </section>

  <footer>
    <p>© 2025 Bilum Haus PNG | Made in Papua New Guinea 🇵🇬</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
